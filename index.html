<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>网络复习卡</title>
  <meta name="theme-color" content="#0e1017">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="复习卡">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg:#0e1017; --card:#171a26; --card2:#1d2130; --text:#eceff4; --muted:#8b93a5;
      --violet:#8b7cf6; --violet-soft:rgba(139,124,246,.15); --border:#262b3d;
      --green:#34d399; --green-soft:rgba(52,211,153,.15);
      --red:#f87171; --red-soft:rgba(248,113,113,.15); --amber:#fbbf24;
      color-scheme: dark;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      font-size:16.5px; line-height:1.6;
      display:flex; justify-content:center;
      padding:20px 16px 0;
      padding-top:calc(20px + env(safe-area-inset-top));
      padding-bottom:calc(86px + env(safe-area-inset-bottom));
    }
    .wrap { width:100%; max-width:520px; }
    button { font-family:inherit; }

    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .back {
      border:1px solid var(--border); background:var(--card); color:var(--text);
      border-radius:12px; padding:8px 14px; font-size:15px; cursor:pointer;
    }
    .back:active { transform:scale(.96); }
    .topbar h1 { font-size:20px; margin:0; font-weight:800; flex:1; }

    .hero { text-align:center; margin:8px 0 20px; }
    .hero .logo { font-size:52px; }
    .hero h1 { font-size:26px; margin:8px 0 4px; font-weight:800; }
    .hero .sub { color:var(--muted); font-size:15px; margin:0; }

    .stats { display:flex; gap:10px; margin:0 0 18px; }
    .stat {
      flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:12px 10px; text-align:center;
    }
    .stat b { display:block; font-size:22px; color:var(--violet); }
    .stat span { font-size:13px; color:var(--muted); }

    .sec-title { font-size:15px; color:var(--muted); margin:20px 0 10px; font-weight:700; letter-spacing:.5px; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .week-card {
      position:relative; background:var(--card); border:1px solid var(--border); border-radius:18px;
      padding:14px; cursor:pointer; text-align:left; transition:transform .05s;
    }
    .week-card:active { transform:scale(.97); }
    .week-card .emoji { font-size:30px; }
    .week-card .wk { font-size:13px; color:var(--violet); font-weight:800; margin-top:6px; }
    .week-card .zh { font-size:16px; font-weight:700; margin:1px 0 0; }
    .week-card .en { font-size:12px; color:var(--muted); margin:0; }
    .week-card .badge {
      position:absolute; top:10px; right:10px; font-size:11px; padding:2px 8px;
      border-radius:999px; font-weight:700;
    }
    .badge.done { background:var(--green-soft); color:var(--green); }
    .badge.weak { background:var(--red-soft); color:var(--red); }
    .badge.best { background:var(--violet-soft); color:#c4b5fd; }

    .note {
      background:var(--amber); color:#422006; border-radius:14px; padding:12px 14px;
      font-size:14px; line-height:1.55; margin-bottom:16px;
    }

    .cardbox { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px 20px; }
    .cardbox .term { font-size:21px; font-weight:800; margin:0 0 4px; }
    .cardbox .term small { color:var(--violet); font-size:14px; font-weight:600; display:block; margin-top:2px; }
    .cardbox .zh { font-size:17px; margin:14px 0 0; line-height:1.7; }
    .cardbox .en { font-size:15px; color:var(--muted); margin:8px 0 0; line-height:1.6; }
    .cardbox .dash { color:var(--violet); font-weight:700; margin:0 8px; }

    .progress { height:6px; background:var(--card2); border-radius:999px; overflow:hidden; margin:16px 0 4px; }
    .progress i { display:block; height:100%; background:var(--violet); border-radius:999px; transition:width .2s; }
    .progress-label { text-align:center; color:var(--muted); font-size:13px; margin:6px 0 16px; }

    .row { display:flex; gap:10px; }
    .btn {
      flex:1; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:700; cursor:pointer;
      transition:opacity .15s, transform .05s;
    }
    .btn:active { transform:scale(.97); }
    .btn.primary { background:var(--violet); color:#fff; }
    .btn.ghost { background:var(--card2); color:var(--text); border:1px solid var(--border); }
    .btn:disabled { opacity:.4; }

    .opt {
      width:100%; text-align:left; background:var(--card2); border:1px solid var(--border);
      border-radius:14px; padding:14px 16px; font-size:16px; color:var(--text); cursor:pointer;
      margin-bottom:10px; line-height:1.5;
    }
    .opt .letter { color:var(--violet); font-weight:800; margin-right:10px; }
    .opt.correct { background:var(--green-soft); border-color:var(--green); }
    .opt.wrong { background:var(--red-soft); border-color:var(--red); }
    .opt:disabled { cursor:default; opacity:.85; }

    .why {
      background:var(--card2); border-radius:14px; padding:14px 16px; margin-top:12px;
      font-size:15px; border-left:3px solid var(--violet);
    }
    .why b { color:var(--violet); }

    .result { text-align:center; }
    .result .big { font-size:56px; }
    .result h2 { font-size:24px; margin:6px 0 2px; }
    .result .score { font-size:17px; color:var(--muted); margin:4px 0 18px; }
    .result .weak-list { text-align:left; margin:6px 0 18px; }
    .result .weak-item {
      background:var(--red-soft); border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:15px;
    }

    .weak-empty { text-align:center; color:var(--muted); padding:40px 20px; }
    .weak-empty .e { font-size:44px; }

    .bottomnav {
      position:fixed; left:0; right:0; bottom:0; z-index:10;
      background:var(--card); border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom);
      display:flex; max-width:520px; margin:0 auto;
    }
    .bottomnav button {
      flex:1; background:none; border:none; color:var(--muted); padding:12px 0 10px;
      font-size:14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .bottomnav button .ic { font-size:22px; }
    .bottomnav button.active { color:var(--violet); }

    footer { text-align:center; color:var(--muted); font-size:12px; margin:26px 0 10px; }
    footer button { background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; }

    .tip { color:var(--muted); font-size:13px; text-align:center; margin-top:8px; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <nav class="bottomnav" id="nav">
    <button id="tab-learn" class="active"><span class="ic">📚</span>学习</button>
    <button id="tab-weak"><span class="ic">🎯</span>薄弱</button>
  </nav>

// ---------- 状态 ----------
const KEY = 'study.v1';
let S = load();
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function weakCount(){ let n=0; for (const k in (S.weak||{})) n += (S.weak[k]||[]).length; return n; }
function learnedCount(){ return Object.keys(S.learned||{}).length; }

const app = document.getElementById('app');

// ---------- 首页 ----------
function renderHome(){
  const learned = learnedCount(), weak = weakCount();
  let grid = '';
  DATA.forEach((w, i) => {
    const done = S.learned && S.learned[i];
    const weakN = (S.weak && S.weak[i]) ? S.weak[i].length : 0;
    const best = (S.best && S.best[i] != null) ? S.best[i] : null;
    let badge = '';
    if (weakN > 0) badge = '<span class="badge weak">薄弱 '+weakN+'</span>';
    else if (best != null) badge = '<span class="badge best">'+best+'/'+w.quiz.length+'</span>';
    else if (done) badge = '<span class="badge done">已学</span>';
    grid += '<div class="week-card" onclick="openWeek('+i+')">'
          + badge
          + '<div class="emoji">'+w.emoji+'</div>'
          + '<div class="wk">Week '+(i+1)+'</div>'
          + '<p class="zh">'+w.zh+'</p>'
          + '<p class="en">'+w.en+'</p>'
          + '</div>';
  });
  app.innerHTML =
    '<div class="hero">'
    + '<div class="logo">🎓</div>'
    + '<h1>网络复习卡</h1>'
    + '<p class="sub">中英双语 · 先学后测 · 薄弱自动加强</p>'
    + '</div>'
    + '<div class="stats">'
    + '<div class="stat"><b>'+learned+'/12</b><span>已学周</span></div>'
    + '<div class="stat"><b>'+weak+'</b><span>薄弱点</span></div>'
    + '</div>'
    + '<div class="sec-title">选择要复习的周</div>'
    + '<div class="grid">'+grid+'</div>'
    + '<footer>网络知识复习卡 · Jeiu 为你整理'
    + '<br><button onclick="resetAll()">清除全部进度</button>'
    + '</footer>';
  syncNav('learn');
}

// ---------- 学习 ----------
let curWeek = -1, curCard = 0;
function openWeek(i){
  curWeek = i; curCard = 0;
  const w = DATA[i];
  if (S.learned) S.learned[i] = true; else S.learned = {[i]:true};
  save();
  renderCard();
}
function renderCard(){
  const w = DATA[curWeek];
  const c = w.cards[curCard];
  const note = w.note ? '<div class="note">'+w.note+'</div>' : '';
  const isLast = curCard === w.cards.length - 1;
  app.innerHTML =
    '<div class="topbar"><button class="back" onclick="renderHome()">← 返回</button><h1>Week '+(curWeek+1)+' '+w.zh+'</h1></div>'
    + note
    + '<div class="cardbox">'
    + '<p class="term">'+w.emoji+' '+c.t+'</p>'
    + '<p class="zh">'+c.zh+'</p>'
    + '<p class="en">'+c.en+'</p>'
    + '</div>'
    + '<div class="progress"><i style="width:'+((curCard+1)/w.cards.length*100)+'%"></i></div>'
    + '<div class="progress-label">知识点 '+(curCard+1)+' / '+w.cards.length+'</div>'
    + '<div class="row">'
    + '<button class="btn ghost" onclick="prevCard()" '+(curCard===0?'disabled':'')+'>上一张</button>'
    + (isLast
        ? '<button class="btn primary" onclick="startQuiz()">开始测验 🚀</button>'
        : '<button class="btn primary" onclick="nextCard()">下一张</button>')
    + '</div>'
    + '<p class="tip">学完知识点就可以开始测验啦</p>';
  window.scrollTo(0,0);
}
function nextCard(){ if (curCard < DATA[curWeek].cards.length-1){ curCard++; renderCard(); } }
function prevCard(){ if (curCard > 0){ curCard--; renderCard(); } }

// ---------- 测验 ----------
let qIdx = 0, wrong = [], answered = false;
function startQuiz(){
  qIdx = 0; wrong = []; answered = false;
  renderQuestion();
}
function renderQuestion(){
  const w = DATA[curWeek];
  const q = w.quiz[qIdx];
  answered = false;
  let opts = '';
  q.o.forEach((o, oi) => {
    opts += '<button class="opt" data-o="'+oi+'" onclick="answer('+oi+')"><span class="letter">'+String.fromCharCode(65+oi)+'</span>'+o+'</button>';
  });
  app.innerHTML =
    '<div class="topbar"><button class="back" onclick="openWeek('+curWeek+')">← 返回</button><h1>测验 · Week '+(curWeek+1)+'</h1></div>'
    + '<div class="cardbox">'
    + '<p class="zh" style="font-size:17px;margin:0;">'+w.emoji+' '+q.q+'</p>'
    + '<p class="en" style="color:var(--muted);font-size:14px;margin:8px 0 16px;">'+q.en+'</p>'
    + opts
    + '<div id="why"></div>'
    + '</div>'
    + '<div class="progress"><i style="width:'+((qIdx)/w.quiz.length*100)+'%"></i></div>'
    + '<div class="progress-label">第 '+(qIdx+1)+' / '+w.quiz.length+' 题</div>'
    + '<div class="row" id="nextRow" style="display:none;">'
    + '<button class="btn primary" onclick="nextQ()">下一题</button>'
    + '</div>';
}
function answer(oi){
  if (answered) return;
  answered = true;
  const w = DATA[curWeek];
  const q = w.quiz[qIdx];
  const opts = app.querySelectorAll('.opt');
  opts.forEach((el, i) => {
    el.disabled = true;
    if (i === q.a) el.classList.add('correct');
    else if (i === oi) el.classList.add('wrong');
  });
  const whyEl = document.getElementById('why');
  if (oi === q.a){
    whyEl.innerHTML = '<div class="why"><b>✅ 答对了！</b> '+q.why+'</div>';
  } else {
    wrong.push(qIdx);
    whyEl.innerHTML = '<div class="why"><b>❌ 答错了</b> 正确答案是 '+String.fromCharCode(65+q.a)+'。<br>'+q.why+'</div>';
  }
  const nr = document.getElementById('nextRow');
  nr.style.display = 'flex';
  nr.querySelector('button').textContent = (qIdx === w.quiz.length-1) ? '看结果 🏁' : '下一题';
}
function nextQ(){
  const w = DATA[curWeek];
  if (qIdx < w.quiz.length - 1){ qIdx++; renderQuestion(); }
  else { finishQuiz(); }
}
function finishQuiz(){
  const w = DATA[curWeek];
  const total = w.quiz.length;
  const score = total - wrong.length;
  // 保存薄弱点
  if (!S.weak) S.weak = {};
  S.weak[curWeek] = wrong.slice();
  if (wrong.length === 0) delete S.weak[curWeek];
  if (!S.best) S.best = {};
  S.best[curWeek] = Math.max(S.best[curWeek]||0, score);
  save();
  let emoji, title;
  if (score === total){ emoji = '🏆'; title = '满分！太棒了'; }
  else if (score >= total*0.8){ emoji = '⭐⭐⭐'; title = '很棒！'; }
  else if (score >= total*0.6){ emoji = '⭐⭐'; title = '不错，继续！'; }
  else { emoji = '💪'; title = '别灰心，再来一遍'; }
  let weakList = '';
  if (wrong.length > 0){
    weakList = '<div class="weak-list">';
    wrong.forEach(qi => {
      weakList += '<div class="weak-item">❌ '+w.quiz[qi].q+'</div>';
    });
    weakList += '</div>';
  }
  app.innerHTML =
    '<div class="topbar"><button class="back" onclick="renderHome()">← 返回</button><h1>Week '+(curWeek+1)+' 结果</h1></div>'
    + '<div class="cardbox result">'
    + '<div class="big">'+emoji+'</div>'
    + '<h2>'+title+'</h2>'
    + '<p class="score">答对 '+score+' / '+total+' 题</p>'
    + weakList
    + '<div class="row">'
    + '<button class="btn ghost" onclick="openWeek('+curWeek+')">再学一遍</button>'
    + '<button class="btn primary" onclick="startQuiz()">再测一次</button>'
    + '</div>'
    + '</div>'
    + '<div class="row" style="margin-top:12px;"><button class="btn ghost" onclick="renderHome()">回到首页</button></div>';
}

// ---------- 薄弱点 ----------
function renderWeak(){
  const weak = S.weak || {};
  let items = [];
  for (const k in weak){
    const wi = parseInt(k, 10);
    (weak[k]||[]).forEach(qi => items.push({wi, qi}));
  }
  syncNav('weak');
  if (items.length === 0){
    app.innerHTML =
      '<div class="topbar"><h1>薄弱点</h1></div>'
      + '<div class="weak-empty"><div class="e">🎉</div><p>没有薄弱点啦！<br>你答错的题会出现在这里，方便反复加强。</p></div>';
    return;
  }
  let html = '<div class="topbar"><h1>薄弱点</h1></div>'
    + '<p class="sub" style="color:var(--muted);font-size:14px;margin:0 0 14px;">点一题开始重新挑战，答对就移除 ✅</p>';
  items.forEach((it, idx) => {
    const w = DATA[it.wi];
    html += '<div class="cardbox" style="margin-bottom:12px;padding:16px;">'
      + '<div style="font-size:13px;color:var(--violet);font-weight:700;margin-bottom:4px;">Week '+(it.wi+1)+' '+w.emoji+'</div>'
      + '<p style="margin:0 0 10px;font-size:15px;">'+w.quiz[it.qi].q+'</p>'
      + '<button class="btn primary" style="padding:11px;" onclick="requiz('+it.wi+','+it.qi+')">重新挑战</button>'
      + '</div>';
  });
  app.innerHTML = html;
}
function requiz(wi, qi){
  curWeek = wi; qIdx = qi; wrong = [];
  const w = DATA[wi];
  const q = w.quiz[qi];
  answered = false;
  let opts = '';
  q.o.forEach((o, oi) => {
    opts += '<button class="opt" data-o="'+oi+'" onclick="ranswer('+oi+','+qi+')"><span class="letter">'+String.fromCharCode(65+oi)+'</span>'+o+'</button>';
  });
  app.innerHTML =
    '<div class="topbar"><button class="back" onclick="renderWeak()">← 返回</button><h1>重做 · Week '+(wi+1)+'</h1></div>'
    + '<div class="cardbox">'
    + '<p class="zh" style="font-size:17px;margin:0;">'+w.emoji+' '+q.q+'</p>'
    + '<p class="en" style="color:var(--muted);font-size:14px;margin:8px 0 16px;">'+q.en+'</p>'
    + opts
    + '<div id="why"></div>'
    + '</div>';
}
function ranswer(oi, qi){
  if (answered) return;
  answered = true;
  const w = DATA[curWeek];
  const q = w.quiz[qi];
  const opts = app.querySelectorAll('.opt');
  opts.forEach((el, i) => {
    el.disabled = true;
    if (i === q.a) el.classList.add('correct');
    else if (i === oi) el.classList.add('wrong');
  });
  const whyEl = document.getElementById('why');
  if (oi === q.a){
    // 移除薄弱点
    if (S.weak && S.weak[curWeek]){
      S.weak[curWeek] = S.weak[curWeek].filter(x => x !== qi);
      if (S.weak[curWeek].length === 0) delete S.weak[curWeek];
    }
    save();
    whyEl.innerHTML = '<div class="why"><b>✅ 掌握啦！</b> 已从薄弱点移除。</div>';
  } else {
    whyEl.innerHTML = '<div class="why"><b>❌ 还没对</b> 正确答案是 '+String.fromCharCode(65+q.a)+'。<br>'+q.why+'</div>';
  }
  whyEl.innerHTML += '<div class="row" style="margin-top:14px;"><button class="btn primary" onclick="renderWeak()">继续</button></div>';
}

let resetArmed = false;
function resetAll(){
  if (!resetArmed){
    resetArmed = true;
    const b = document.querySelector('footer button');
    if (b){ b.textContent = '再点一次确认清除'; b.style.color = '#f87171'; }
    setTimeout(() => { resetArmed = false; }, 3000);
    return;
  }
  S = {}; save();
  resetArmed = false;
  renderHome();
}

function syncNav(tab){
  document.getElementById('tab-learn').classList.toggle('active', tab==='learn');
  document.getElementById('tab-weak').classList.toggle('active', tab==='weak');
}
document.getElementById('tab-learn').addEventListener('click', renderHome);
document.getElementById('tab-weak').addEventListener('click', renderWeak);

renderHome();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
